<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css">
<title>Sprite Check</title>
</head>
<body>
<div class="app">
<header class="top"><div><h1>Sprite Check</h1><p>Spriteコレクション管理</p></div><div class="actions"><button id="theme">🌙</button><button id="lang">EN</button></div></header>
<section class="stats"><div class="stat">所持<b id="owned">0</b></div><div class="stat">Master<b id="master">0</b></div><div class="stat">達成率<b id="rate">0%</b></div></section>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Spriteを検索"><select id="filter"><option value="all">すべて</option><option value="owned">所持</option><option value="unowned">未所持</option><option value="master">Master</option><option value="upcoming">近日登場</option><option value="new">新着</option></select></div></section>
<section class="panel"><div class="row"><button id="sync">Spriteデータ更新</button><span id="syncStatus">自動更新対象を確認中…</span></div><p>新しいSpriteが公開データに追加されると、次回更新時に一覧へ反映します。</p></section>
<section class="panel"><h2>画像チェック・自動認識</h2><input id="import" type="file" accept="image/*" multiple><div id="preview" class="import-preview"></div><div class="row" style="margin-top:10px"><button id="recognize">画像からSpriteを認識</button><span id="ocrStatus">画像を選択してください。</span></div><div id="reviewResults"></div><p>認識結果は自動確定せず、候補を確認してから反映します。</p></section>
<section class="panel"><div class="row"><button id="export">バックアップ出力</button><label><button type="button" onclick="document.getElementById('restore').click()">バックアップ復元</button><input id="restore" type="file" accept=".json" hidden></label><button id="reset" class="danger">データリセット</button></div></section>
<main id="grid" class="grid"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="./data/sprites.js"></script><script src="./app.js"></script>
</body></html>
